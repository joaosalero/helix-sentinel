name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: helix_sentinel_test
          POSTGRES_USER: helix
          POSTGRES_PASSWORD: helix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helix -d helix_sentinel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          python -m pip install -e ".[dev,security]"
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy backend
      - name: Migration smoke
        run: alembic -c backend/alembic.ini upgrade head
        env:
          HELIX_DATABASE_URL: postgresql+asyncpg://helix:helix@localhost:5432/helix_sentinel_test
      - name: Test
        run: pytest
      - name: Bandit
        run: bandit -r backend -x backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
