name: Temporary Helix dependency lock resolution

on:
  push:
    branches: [fix/portfolio-evidence-20261123]
    paths: [.github/workflows/dependency-resolution.yml]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup project Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          check-latest: false

      - name: Use a reproducible npm release
        run: npm install --global npm@11.17.0 --ignore-scripts

      - name: Resolve compatible security updates without lifecycle scripts
        working-directory: frontend
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.dependencies.next !== '16.3.0') {
            throw new Error('Unexpected Next.js baseline; inspect the pushed source before resolving');
          }
          pkg.dependencies.next = '16.4.6';
          pkg.devDependencies['eslint-config-next'] = '16.4.6';
          pkg.devDependencies['@next/eslint-plugin-next'] = '16.4.6';
          // Next 16.4.6 already requires sharp ^0.35.5; preserve an explicit override if present.
          if (pkg.overrides && Object.hasOwn(pkg.overrides, 'sharp')) {
            pkg.overrides.sharp = '0.35.5';
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts

      - name: Audit the resulting dependency graph
        if: ${{ always() }}
        working-directory: frontend
        run: npm audit --json > ../dependency-audit.json

      - name: Export public dependency inputs and audit report
        if: ${{ always() }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const crypto = require('node:crypto');
          const names = ['frontend/package.json', 'frontend/package-lock.json', 'dependency-audit.json'];
          const files = Object.fromEntries(names.filter(name => fs.existsSync(name)).map(name => [name, fs.readFileSync(name, 'utf8')]));
          const payload = JSON.stringify({ sourceSha: process.env.GITHUB_SHA, files });
          const packed = zlib.gzipSync(payload).toString('base64');
          console.log('DEPENDENCY_PAYLOAD_SHA256=' + crypto.createHash('sha256').update(payload).digest('hex'));
          console.log('DEPENDENCY_PAYLOAD_GZIP_BASE64_BEGIN');
          for (let i = 0; i < packed.length; i += 3000) console.log(packed.slice(i, i + 3000));
          console.log('DEPENDENCY_PAYLOAD_GZIP_BASE64_END');
          NODE

      - name: Retain reviewable dependency files
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helix-dependency-resolution
          retention-days: 1
          if-no-files-found: error
          path: |
            frontend/package.json
            frontend/package-lock.json
            dependency-audit.json
