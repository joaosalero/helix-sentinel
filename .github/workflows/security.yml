name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          python -m pip install -e ".[security]"
      - name: Bandit
        run: bandit -r backend -x backend/tests
      - name: pip-audit
        run: pip-audit --skip-editable

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: infra/semgrep/semgrep.yml

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: infra/gitleaks/gitleaks.toml
