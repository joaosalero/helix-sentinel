name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install security dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          python -m pip install -e ".[security]"
      - name: Bandit
        run: bandit -r backend -x backend/tests
      - name: pip-audit
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2025-183

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --retry 3 \
            --output "${archive_path}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive_path}" > "${RUNNER_TEMP}/actionlint.sha256"
          sha256sum --check "${RUNNER_TEMP}/actionlint.sha256"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade "pip>=26.1"
          python -m pip install "semgrep>=1.145"
      - name: Semgrep
        run: semgrep scan --config infra/semgrep/semgrep.yml --error

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: infra/gitleaks/gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
