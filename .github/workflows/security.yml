name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          python -m pip install -e ".[security]"
      - name: Bandit
        run: bandit -r backend -x backend/tests
      - name: pip-audit
        run: pip-audit --skip-editable

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade "pip>=26.1"
          python -m pip install "semgrep>=1.145"
      - name: Semgrep
        run: semgrep scan --config infra/semgrep/semgrep.yml --error

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: infra/gitleaks/gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
