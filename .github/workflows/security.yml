name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install security dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          python -m pip install -e ".[security]"
      - name: Bandit
        run: bandit -r backend -x backend/tests
      - name: pip-audit
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2025-183

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --retry 3 \
            --output "${archive_path}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive_path}" > "${RUNNER_TEMP}/actionlint.sha256"
          sha256sum --check "${RUNNER_TEMP}/actionlint.sha256"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade "pip>=26.1"
          python -m pip install "semgrep>=1.145"
      - name: Semgrep
        run: semgrep scan --config infra/semgrep/semgrep.yml --error

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --retry 3 \
            --output "${archive_path}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive_path}" > "${RUNNER_TEMP}/gitleaks.sha256"
          sha256sum --check "${RUNNER_TEMP}/gitleaks.sha256"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}" --no-same-owner gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version
      - name: Verify Gitleaks detection control
        run: |
          canary_dir="${RUNNER_TEMP}/gitleaks-canary"
          canary_report="${RUNNER_TEMP}/gitleaks-canary.json"
          install -d -m 0700 "${canary_dir}"
          printf '%s%s%s\n' \
            'ghp_' \
            'aBcDeFgHiJkLmNoPqRsTuVwXyZ' \
            '0123456789' > "${canary_dir}/canary.txt"

          set +e
          "${RUNNER_TEMP}/gitleaks" dir "${canary_dir}" \
            --config infra/gitleaks/gitleaks.toml \
            --exit-code 2 \
            --max-decode-depth 0 \
            --no-banner \
            --no-color \
            --redact=100 \
            --report-format json \
            --report-path "${canary_report}" \
            --verbose > "${RUNNER_TEMP}/gitleaks-canary.log" 2>&1
          canary_status="$?"
          set -e

          if [[ "${canary_status}" -ne 2 ]] || \
             ! jq -e 'length > 0 and all(.[]; .Secret == "REDACTED")' "${canary_report}" > /dev/null; then
            echo "Gitleaks detection control failed" >&2
            exit 1
          fi
      - name: Scan committed changes for secrets
        env:
          GITLEAKS_EVENT_NAME: ${{ github.event_name }}
          GITLEAKS_PR_BASE: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_PUSH_BEFORE: ${{ github.event.before }}
          GITLEAKS_SHA: ${{ github.sha }}
        run: |
          require_sha() {
            if [[ ! "$1" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid commit SHA in GitHub event payload" >&2
              exit 1
            fi
          }

          case "${GITLEAKS_EVENT_NAME}" in
            pull_request)
              require_sha "${GITLEAKS_PR_BASE}"
              require_sha "${GITLEAKS_SHA}"
              git cat-file -e "${GITLEAKS_PR_BASE}^{commit}"
              from_ref="${GITLEAKS_PR_BASE}"
              to_ref="${GITLEAKS_SHA}"
              ;;
            push)
              require_sha "${GITLEAKS_SHA}"
              from_ref="${GITLEAKS_PUSH_BEFORE}"
              to_ref="${GITLEAKS_SHA}"
              ;;
            *)
              echo "Unsupported event: ${GITLEAKS_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if ! git cat-file -e "${to_ref}^{commit}" 2>/dev/null; then
            echo "Unable to resolve the scan head commit" >&2
            exit 1
          fi

          if [[ -z "${from_ref}" || "${from_ref}" =~ ^0+$ ]] || \
             ! git cat-file -e "${from_ref}^{commit}" 2>/dev/null || \
             ! git merge-base --is-ancestor "${from_ref}" "${to_ref}"; then
            log_opts="--diff-merges=first-parent ${to_ref}"
            expected_count="$(git rev-list --count "${to_ref}")"
          else
            expected_count="$(git rev-list --count "${from_ref}..${to_ref}")"
            if [[ "${expected_count}" -eq 0 ]]; then
              echo "No commits to scan"
              exit 0
            fi
            log_opts="--diff-merges=first-parent ${from_ref}..${to_ref}"
          fi

          if [[ "${expected_count}" -eq 0 ]]; then
            echo "Resolved Gitleaks range is empty" >&2
            exit 1
          fi

          set +e
          scan_report="${RUNNER_TEMP}/gitleaks-scan.json"
          "${RUNNER_TEMP}/gitleaks" git \
            --config infra/gitleaks/gitleaks.toml \
            --exit-code 2 \
            --log-opts "${log_opts}" \
            --max-decode-depth 0 \
            --no-banner \
            --no-color \
            --redact=100 \
            --report-format json \
            --report-path "${scan_report}" \
            --verbose \
            . 2>&1 | tee "${RUNNER_TEMP}/gitleaks-scan.log"
          scan_status="${PIPESTATUS[0]}"
          set -e

          if [[ "${scan_status}" -ne 0 && "${scan_status}" -ne 2 ]]; then
            echo "Gitleaks execution failed" >&2
            exit "${scan_status}"
          fi
          if ! grep -Eq '(^| )[0-9]+ commits scanned\.' "${RUNNER_TEMP}/gitleaks-scan.log"; then
            echo "Gitleaks did not report a completed commit scan" >&2
            exit 1
          fi
          echo "Validated Gitleaks range contains ${expected_count} commit(s)"
          finding_count="$(jq 'length' "${scan_report}")"
          if [[ "${finding_count}" -gt 0 ]]; then
            echo "Gitleaks detected ${finding_count} finding(s)" >&2
            exit 2
          fi
          if [[ "${scan_status}" -ne 0 ]]; then
            echo "Gitleaks returned a finding status without a report" >&2
            exit 1
          fi
