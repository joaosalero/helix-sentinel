name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install security dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          python -m pip install -e ".[security]"
      - name: Bandit
        run: bandit -r backend -x backend/tests
      - name: pip-audit
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2025-183

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --retry 3 \
            --output "${archive_path}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive_path}" > "${RUNNER_TEMP}/actionlint.sha256"
          sha256sum --check "${RUNNER_TEMP}/actionlint.sha256"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade "pip>=26.1"
          python -m pip install "semgrep>=1.145"
      - name: Semgrep
        run: semgrep scan --config infra/semgrep/semgrep.yml --error

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --retry 3 \
            --output "${archive_path}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive_path}" > "${RUNNER_TEMP}/gitleaks.sha256"
          sha256sum --check "${RUNNER_TEMP}/gitleaks.sha256"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}" --no-same-owner gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version
      - name: Verify Gitleaks detection control
        run: |
          canary_dir="${RUNNER_TEMP}/gitleaks-canary"
          canary_report="${RUNNER_TEMP}/gitleaks-canary.json"
          install -d -m 0700 "${canary_dir}"
          canary_value="ghp_$(printf '%s' 'helix-sentinel-gitleaks-positive-control-v2' | sha256sum | cut -c1-36)"
          printf '%s\n' "${canary_value}" > "${canary_dir}/canary.txt"

          set +e
          "${RUNNER_TEMP}/gitleaks" dir "${canary_dir}" \
            --config infra/gitleaks/gitleaks.toml \
            --exit-code 2 \
            --max-decode-depth 0 \
            --no-banner \
            --no-color \
            --redact=100 \
            --report-format json \
            --report-path "${canary_report}" \
            --verbose > "${RUNNER_TEMP}/gitleaks-canary.log" 2>&1
          canary_status="$?"
          set -e

          if [[ "${canary_status}" -ne 2 ]] || \
             ! jq -e 'length > 0 and all(.[]; .Secret == "REDACTED" and (.Match | contains("REDACTED")))' "${canary_report}" > /dev/null || \
             grep -Fq -- "${canary_value}" "${canary_report}" "${RUNNER_TEMP}/gitleaks-canary.log"; then
            unset canary_value
            echo "Gitleaks detection control failed" >&2
            exit 1
          fi
          unset canary_value
      - name: Test Gitleaks commit coverage
        run: |
          scripts/security/test-gitleaks-range.sh \
            "${RUNNER_TEMP}/gitleaks" \
            infra/gitleaks/gitleaks.toml
      - name: Scan committed changes for secrets
        env:
          GITLEAKS_EVENT_NAME: ${{ github.event_name }}
          GITLEAKS_PR_BASE: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_PUSH_BEFORE: ${{ github.event.before }}
          GITLEAKS_SHA: ${{ github.sha }}
        run: |
          set +e
          scan_report="${RUNNER_TEMP}/gitleaks-scan.json"
          scripts/security/run-gitleaks-range.sh \
            "${RUNNER_TEMP}/gitleaks" \
            infra/gitleaks/gitleaks.toml \
            "${GITLEAKS_EVENT_NAME}" \
            "${GITLEAKS_PR_BASE}" \
            "${GITLEAKS_PUSH_BEFORE}" \
            "${GITLEAKS_SHA}" \
            "${scan_report}" \
            .
          scan_status="$?"
          set -e

          if [[ "${scan_status}" -ne 0 && "${scan_status}" -ne 2 ]]; then
            echo "Gitleaks execution failed" >&2
            exit "${scan_status}"
          fi
          finding_count="$(jq 'length' "${scan_report}")"
          if [[ "${finding_count}" -gt 0 ]]; then
            echo "Gitleaks detected ${finding_count} finding(s)" >&2
            exit 2
          fi
          if [[ "${scan_status}" -ne 0 ]]; then
            echo "Gitleaks returned a finding status without a report" >&2
            exit 1
          fi
