[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-sentinel"
version = "0.1.0"
description = "Security Analytics and Detection Engineering Platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "fastapi>=0.111",
  "opentelemetry-api>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "argon2-cffi>=23.1",
  "prometheus-client>=0.20",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "python-json-logger>=2.0",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
analytics = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.5"]
dev = ["httpx>=0.27", "mypy>=1.10", "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]
security = ["bandit[toml]>=1.7", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = ["opentelemetry.exporter.otlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.bandit]
# Keep test fixtures and intentionally synthetic credentials out of CI security scan noise.
exclude_dirs = ["backend/tests"]
skips = ["B101"]
